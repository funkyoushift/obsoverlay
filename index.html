<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FunkYouSHiFT Overlay</title>

<link rel="preconnect" href="https://streamlabs.com" crossorigin>
<link rel="dns-prefetch" href="https://streamlabs.com">
<link rel="preconnect" href="https://throne.com" crossorigin>
<link rel="dns-prefetch" href="https://throne.com">

<style>
:root{--orange:#ff5a1f;--orange-hot:#ff7a24;--violet:#a46bff;--teal:#31e6d3;--panel:rgba(10,12,17,.88);--line:rgba(255,255,255,.2);--safe:2.08vw;--headerTop:2.08vw}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:#f7f7f4;font-family:"Arial Narrow","Segoe UI",sans-serif}
.overlay{position:relative;width:100vw;height:100vh;isolation:isolate}
.overlay:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.012) 8px);z-index:90}
.panel{position:absolute;overflow:hidden;background:linear-gradient(135deg,rgba(27,30,38,.94),var(--panel));border:1px solid var(--line);box-shadow:0 18px 54px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.035);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}
.panel:before{content:"";position:absolute;inset:0 auto 0 0;width:.31vw;background:linear-gradient(var(--orange-hot),var(--orange));box-shadow:0 0 22px rgba(255,90,31,.48);z-index:3}
.panel.violet:before{background:var(--violet);box-shadow:0 0 22px rgba(164,107,255,.48)}
.panel>iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.brand-lockup{top:var(--headerTop);left:var(--safe);width:16vw;height:3.4vw;display:flex;align-items:center;padding:0 1.7vw;z-index:30}
.brand{font-size:1.7vw;font-weight:1000;line-height:1;letter-spacing:-.055em;text-transform:uppercase;white-space:nowrap}.brand .shift{color:var(--orange)}
.slash{width:.25vw;height:54%;margin-left:1.1vw;background:var(--teal);transform:skew(-15deg);box-shadow:0 0 22px rgba(49,230,211,.4)}
.throne{top:calc(var(--headerTop) + 4.2vw);left:var(--safe);width:21vw;height:9vw;z-index:20}
.status{right:var(--safe);top:var(--headerTop);width:18vw;height:3.4vw;display:flex;align-items:center;justify-content:center;padding:0 1vw;font-size:.72vw;font-weight:900;letter-spacing:.15em;text-transform:uppercase;z-index:30}
.scene{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:25}.scene[open]{display:grid}
.scene-box{padding:1.5vw 2vw;background:rgba(0,0,0,.34);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));text-align:center}
.title{font-size:4.7vw;font-weight:1000;line-height:1;text-transform:uppercase;text-shadow:0 6px 0 #000,0 16px 42px rgba(0,0,0,.85)}
.sub{margin-top:.5vw;font-size:1.25vw;font-weight:700}.cd{margin-top:.4vw;font-size:2.4vw;font-weight:1000;color:var(--orange)}
.hidden{display:none!important}
body.preview{background:#07090d}body.preview .overlay{background:radial-gradient(circle at 50% 52%,rgba(255,90,31,.08),transparent 38%),linear-gradient(135deg,#20232a 0%,#11141a 52%,#252018 100%)}
</style>
</head>
<body>
<main class="overlay" aria-label="FunkYouSHiFT stream overlay">
  <section class="brand-lockup panel" aria-label="Channel branding"><div id="brand" class="brand">FUNKYOU<span class="shift">SHIFT</span></div><span class="slash" aria-hidden="true"></span></section>
  <section class="status panel" aria-label="Stream status"><span id="status">WELCOME TO THE SHIFT</span></section>
  <section class="throne panel" aria-label="Throne featured item"><iframe id="throne" title="Throne Featured Item" loading="eager" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe></section>
  <section id="layer" class="scene" aria-hidden="true"><div class="scene-box"><div id="t" class="title">STARTING SOON</div><div id="s" class="sub">Grab a snack. We go live in…</div><div id="c" class="cd hidden">10:00</div></div></section>
</main>

<script>
/* Dynamic Streamlabs widgets intentionally remain direct OBS sources because
   Streamlabs blocks them when nested on a third-party site. */
const DEFAULTS = {
  throneUrl:   "https://throne.com/featured-item-overlay/twitch:492630829",
  brand:       "FUNKYOUSHIFT",
  status:      "WELCOME TO THE SHIFT"
};

const q = new URLSearchParams(location.search);
const get = (k) => q.get(k) || DEFAULTS[k] || "";
const brandText = get('brand');
const brandEl = document.getElementById('brand');
const shiftAt = brandText.toUpperCase().lastIndexOf('SHIFT');
brandEl.textContent = shiftAt > -1 ? brandText.slice(0, shiftAt) : brandText;
if(shiftAt > -1){ const span=document.createElement('span'); span.className='shift'; span.textContent=brandText.slice(shiftAt); brandEl.append(span); }
document.getElementById('status').textContent = get('status');

const headerTop = q.get('headerTop');
if(headerTop) document.documentElement.style.setProperty('--headerTop', /^\d+(\.\d+)?$/.test(headerTop) ? `${Number(headerTop)/38.4}vw` : headerTop);

/* small cache-buster so OBS doesn't keep stale widgets */
const withBust = (url) => {
  try { const u = new URL(url); u.searchParams.set('_v', Date.now()); return u.toString(); }
  catch { return url; }
};

/* set embeds (hide panel if missing) */
function setSrc(id, url){
  const el = document.getElementById(id);
  if(!el){ return; }
  if(!url){ el.closest('.panel')?.classList.add('hidden'); el.src = 'about:blank'; return; }
  el.src = withBust(url);
}
setSrc('throne',  get('throneUrl'));
const toggle = (selector,param,defaultOn=true) => document.querySelector(selector)?.classList.toggle('hidden', (q.get(param) ?? (defaultOn?'1':'0')) === '0');
toggle('.throne','showThrone'); toggle('.status','showStatus');
document.body.classList.toggle('preview', q.get('preview') === '1');

const layer = document.getElementById('layer'),
      title = document.getElementById('t'),
      sub   = document.getElementById('s'),
      cd    = document.getElementById('c');
const scene = (q.get("scene") || "main").toLowerCase();

function showLayer(on){ layer.toggleAttribute('open', !!on); layer.setAttribute('aria-hidden', on? 'false':'true'); }

if(scene==='starting'){
  showLayer(true);
  title.textContent = 'STARTING SOON';
  sub.textContent   = 'Grab a snack. We go live in…';
  const cdStr = q.get('cd');
  if(cdStr){
    cd.classList.remove('hidden');
    let t = Math.max(0, parseInt(cdStr,10) || 0);
    const fmt = n => String(n).padStart(2,'0');
    (function tick(){ const m=Math.floor(t/60), s=t%60;
      cd.textContent = `${fmt(m)}:${fmt(s)}`;
      if(t>0){ t--; setTimeout(tick,1000); }
    })();
  }
}
if(scene==='ending'){
  showLayer(true);
  title.textContent = 'THANKS FOR WATCHING';
  sub.textContent = 'Stay weird. Stay kind. See you next stream.';
}
</script>
</body>
</html>
